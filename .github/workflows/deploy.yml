name: Deployment pipeline

on:
  push:
    branches:
      - 'develop'
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get commit hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.OCPP_ACCESSKEY_ID }}
          aws-secret-access-key: ${{ secrets.OCPP_SECRET_ACCESSKEY_ID }}
          aws-region: ap-southeast-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20:latest .
          docker tag ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20:latest \
                     ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20:$COMMIT_HASH

      - name: Push Docker image
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20:$COMMIT_HASH

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install SSH client
        run: sudo apt-get install -y openssh-client
      
      - name: Setup SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OCPP_ACCESSKEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCPP_SECRET_ACCESSKEY_ID }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}vs
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST bash -s <<'EOF'
            # Login ECR
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=ap-southeast-1
            aws ecr get-login-password --region ap-southeast-1 | \
              docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com

            # Pull & run container
            docker pull $AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20:latest
            docker stop my-container || true
            docker rm my-container || true
            docker run -d -p 8081:8081 --name my-container $AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/ptr/ocpp20:latest
          EOF
